[tool.pytest.ini_options]
testpaths = ["."]
norecursedirs = [".venv", ".git", "legacy", "artifacts", "docs", "__pycache__"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py314"
exclude = ["legacy", ".venv", "docs/research_evidence"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
